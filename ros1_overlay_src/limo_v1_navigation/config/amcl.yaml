use_map_topic: true
odom_frame_id: odom
base_frame_id: base_link
global_frame_id: map
odom_model_type: diff
odom_alpha1: 0.2
odom_alpha2: 0.2
odom_alpha3: 0.1
odom_alpha4: 0.2
odom_alpha5: 0.1
gui_publish_rate: 5.0
laser_max_beams: 60
laser_max_range: 16.0
laser_min_range: 0.02
min_particles: 500
max_particles: 2000
kld_err: 0.05
kld_z: 0.99
laser_z_hit: 0.5
laser_z_short: 0.05
laser_z_max: 0.05
laser_z_rand: 0.5
laser_sigma_hit: 0.2
laser_lambda_short: 0.1
laser_model_type: likelihood_field
laser_likelihood_max_dist: 2.0
# Latest real-machine no-motion convergence handoff: process smaller odometry
# increments without adding any automatic rotation or velocity command.
update_min_d: 0.05
update_min_a: 0.10
resample_interval: 1
# One 20 Hz health cycle; below the bridge 0.10 s hard future cap.
transform_tolerance: 0.05
recovery_alpha_slow: 0.0
recovery_alpha_fast: 0.0
